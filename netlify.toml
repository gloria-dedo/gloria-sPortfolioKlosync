# The site is a static export of the Next.js app (output: "export" in next.config.ts):
# `next build` writes plain HTML, CSS and JS to out/, which Netlify serves as is.
# These settings override the dashboard.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"
  # A static export needs no server: skip Netlify's auto-installed Next.js adapter,
  # which expects .next and fails when the publish directory is out/
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
