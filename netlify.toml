# The site used to be plain HTML served from the repo root. It is now a Next.js app,
# so Netlify must build it and publish the Next.js output (these settings override the dashboard).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer
  NODE_VERSION = "22"
