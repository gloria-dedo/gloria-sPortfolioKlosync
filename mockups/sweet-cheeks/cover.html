<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sweet Cheeks campaign cover</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Jost:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/wm.css" />
<style>
  :root { --wine: #4b0322; --rose: #fc8aac; --blush: #ffd9df; --cream: #fff4ee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #999; -webkit-font-smoothing: antialiased; }
  .board { position: relative; width: 1600px; height: var(--h, 1000px); overflow: hidden; background: var(--wine); }
  .board::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .3; mix-blend-mode: soft-light; z-index: 40;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* the type panel */
  .panel { position: absolute; left: 0; top: 0; bottom: 0; width: var(--pw, 760px);
    background: radial-gradient(700px 600px at 20% 15%, #6a0f35 0%, transparent 70%), var(--wine); }
  .kicker { position: absolute; left: 72px; top: 72px; font-family: Jost, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .42em; text-transform: uppercase; color: var(--rose); }
  .headline { position: absolute; left: 66px; font-family: Fraunces, serif; font-weight: 700; color: var(--blush); line-height: .86; letter-spacing: -.035em; }
  .headline .small { display: block; font-weight: 600; letter-spacing: -.02em; }
  .headline em { display: block; font-style: italic; font-weight: 600; color: var(--rose); letter-spacing: -.03em; }
  .wm { position: absolute; z-index: 2; display: block; aspect-ratio: 1800 / 326; background: var(--cream);
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: left center; mask-position: left center; }
  .body { position: absolute; left: 72px; width: 560px; font-family: Jost, sans-serif; font-weight: 500; font-size: 19px; line-height: 1.6; color: var(--blush); opacity: .82; }
  .cta { position: absolute; left: 72px; display: inline-flex; align-items: center; gap: 12px; padding: 14px 24px 14px 26px; border-radius: 999px;
    background: var(--rose); color: var(--wine); font-family: Jost, sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .02em; }
  .cta svg { width: 18px; height: 18px; }

  /* the photo panel, full bleed */
  .photo { position: absolute; top: 0; right: 0; bottom: 0; left: var(--pw, 760px); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, 46% 50%); display: block; }

  /* rotating-text seal riding the seam */
  .seal { position: absolute; border-radius: 50%; background: var(--rose); display: grid; place-items: center; z-index: 5;
    box-shadow: 0 0 0 8px var(--wine), 0 24px 50px -18px rgba(20,0,8,.6); }
  .seal svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; }
  .seal .heart { width: 30%; height: 30%; background: var(--wine);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7.5-4.6-10-9.2C.3 8.4 2.3 4 6.4 4c2.4 0 4 1.4 5.6 3.4C13.6 5.4 15.2 4 17.6 4 21.7 4 23.7 8.4 22 11.8 19.5 16.4 12 21 12 21Z'/></svg>") center / contain no-repeat;
    mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 21s-7.5-4.6-10-9.2C.3 8.4 2.3 4 6.4 4c2.4 0 4 1.4 5.6 3.4C13.6 5.4 15.2 4 17.6 4 21.7 4 23.7 8.4 22 11.8 19.5 16.4 12 21 12 21Z'/></svg>") center / contain no-repeat; }
</style>
</head>
<body data-ready="0">

<template id="seal">
  <svg class="ring" viewBox="0 0 200 200"><defs><path id="c" d="M100 100 m-74 0 a74 74 0 1 1 148 0 a74 74 0 1 1 -148 0"/></defs>
    <text font-family="Jost" font-weight="600" font-size="14" fill="#4b0322"><textPath href="#c" textLength="462" lengthAdjust="spacing">BAKED FRESH DAILY • DANGEROUSLY GOOD •</textPath></text></svg>
  <span class="heart"></span>
</template>

<section class="board" id="wide">
  <div class="panel">
    <div class="kicker">Handmade cakes &amp; treats</div>
    <div class="headline" style="top: 146px; font-size: 196px"><span class="small" style="font-size: 104px">Unapologetically</span><em>sweet.</em></div>
    <div class="body" style="top: 470px">Handmade cakes, pastries and sweet drinks,<br>baked fresh every morning.</div>
    <div class="cta" style="top: 580px">Order your slice <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
  <span class="wm" style="left: 72px; bottom: 76px; width: 470px"></span>
  <div class="photo" style="--pos: 40% 50%"><img src="assets/portrait.jpg" alt=""></div>
  <div class="seal" data-seal style="left: 660px; top: 640px; width: 200px; height: 200px"></div>
</section>

<section class="board" id="card" style="--h: 1200px; --pw: 800px">
  <div class="panel">
    <div class="kicker" style="top: 84px">Handmade cakes &amp; treats</div>
    <div class="headline" style="top: 170px; font-size: 210px"><span class="small" style="font-size: 110px">Unapologetically</span><em>sweet.</em></div>
    <div class="body" style="top: 520px; width: 600px; font-size: 21px">Handmade cakes, pastries and sweet drinks,<br>baked fresh every morning.</div>
    <div class="cta" style="top: 640px; font-size: 19px">Order your slice <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>
  <span class="wm" style="left: 72px; bottom: 86px; width: 520px"></span>
  <div class="photo" style="--pos: 40% 50%"><img src="assets/portrait.jpg" alt=""></div>
  <div class="seal" data-seal style="left: 695px; top: 790px; width: 210px; height: 210px"></div>
</section>

<script>
  const tpl = document.getElementById("seal");
  document.querySelectorAll("[data-seal]").forEach((s) => s.appendChild(tpl.content.cloneNode(true)));
  (async () => { await document.fonts.ready; await Promise.all([...document.images].map((i) => i.decode().catch(() => 0))); document.body.dataset.ready = "1"; })();
  const only = new URLSearchParams(location.search).get("b");
  if (only) document.querySelectorAll(".board").forEach((b) => b.id === only || b.remove());
</script>
</body>
</html>
