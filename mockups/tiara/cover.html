<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tiara campaign cover</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --navy: #141a3a; --navy-2: #232a55; --beige-l: #ead4bc; --beige-r: #d9c2aa; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #999; -webkit-font-smoothing: antialiased; }
  .board { position: relative; width: 1600px; height: var(--h, 1000px); overflow: hidden;
    /* matches the portrait's own studio backdrop, which darkens left to right */
    background: linear-gradient(90deg, #eedac4 0%, var(--beige-l) 30%, #dfc8b0 62%, var(--beige-r) 100%); }
  .board::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }

  /* portrait, feathered into the backdrop on every side but the bottom */
  .portrait { position: absolute; left: 70px; top: 0; height: 100%; aspect-ratio: 1498 / 1950;
    -webkit-mask: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%); mask: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%); }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; display: block; }

  .wordmark { position: absolute; left: 34px; bottom: -0.205em; font-family: "Bodoni Moda", serif; font-weight: 500; font-size: 330px; line-height: 1;
    letter-spacing: .02em; color: var(--navy); mix-blend-mode: multiply; }

  .copy { position: absolute; left: 930px; top: 92px; width: 560px; color: var(--navy); }
  .kicker { font-family: Jost, sans-serif; font-weight: 500; font-size: 14px; letter-spacing: .42em; text-transform: uppercase; opacity: .7; }
  .headline { font-family: "Bodoni Moda", serif; font-size: 74px; line-height: 1.02; margin-top: 22px; letter-spacing: -.01em; }
  .headline em { font-style: italic; }
  .rule { width: 64px; height: 2px; background: var(--navy); margin: 30px 0 22px; opacity: .6; }
  .services { font-family: Jost, sans-serif; font-size: 16px; letter-spacing: .08em; line-height: 1.75; opacity: .82; }

  .phone { position: absolute; width: 300px; background: #0c0c0e; padding: 10px; border-radius: 48px; transform: rotate(-7deg);
    box-shadow: 0 0 0 1.5px #6c6a70, 0 0 0 3px #1c1b1e, 30px 50px 80px -30px rgba(40,25,15,.55), 6px 10px 22px rgba(40,25,15,.25); }
  .phone .scr { position: relative; border-radius: 38px; overflow: hidden; background: #fff; }
  .phone .scr img { display: block; width: 100%; }
  .phone .island { position: absolute; top: 9px; left: 50%; width: 30%; height: 24px; margin-left: -15%; border-radius: 14px; background: #000; z-index: 2; }

  .swatch { position: absolute; width: 230px; height: 230px; border-radius: 50%; overflow: hidden; transform: rotate(10deg);
    box-shadow: 0 0 0 8px #f6ece2, 20px 30px 50px -20px rgba(40,25,15,.45); }
  .swatch img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 52%; }

  .partners { position: absolute; right: 56px; top: 48px; font-family: Jost, sans-serif; font-weight: 500; font-size: 12.5px; letter-spacing: .34em; color: var(--navy); opacity: .62; }
  .split-tag { position: absolute; font-family: Jost, sans-serif; font-size: 12px; letter-spacing: .3em; color: #fff; text-transform: uppercase;
    background: rgba(20,26,58,.78); padding: 7px 12px; border-radius: 999px; backdrop-filter: blur(6px); }
</style>
</head>
<body data-ready="0">

<section class="board" id="wide">
  <div class="portrait"><img src="src/face.png" alt=""></div>
  <div class="copy" style="top: 120px">
    <div class="kicker">AI skin analysis</div>
    <div class="headline">Your skin,<br><em>perfectly</em> matched.</div>
    <div class="rule"></div>
    <div class="services">Scan your skin · Find your shade<br>Book a dermatologist</div>
  </div>
  <div class="swatch" style="left: 940px; top: 520px"><img src="src/swatch.png" alt=""></div>
  <div class="phone" style="left: 1210px; top: 470px"><div class="scr"><div class="island"></div><img src="src/mobile-shade.png" alt=""></div></div>
  <div class="wordmark">TIARA</div>
  <div class="partners">FENTY BEAUTY · LANCÔME · COTY · L’ORÉAL</div>
</section>

<section class="board" id="card" style="--h: 1200px">
  <div class="portrait" style="left: 40px"><img src="src/face.png" alt=""></div>
  <div class="copy" style="left: 980px; top: 110px; width: 540px">
    <div class="kicker">AI skin analysis</div>
    <div class="headline" style="font-size: 84px">Your skin,<br><em>perfectly</em> matched.</div>
    <div class="rule"></div>
    <div class="services">Scan your skin · Find your shade<br>Book a dermatologist</div>
  </div>
  <div class="swatch" style="left: 985px; top: 600px; width: 250px; height: 250px"><img src="src/swatch.png" alt=""></div>
  <div class="phone" style="left: 1230px; top: 560px; width: 320px"><div class="scr"><div class="island"></div><img src="src/mobile-shade.png" alt=""></div></div>
  <div class="wordmark" style="font-size: 360px">TIARA</div>
  <div class="partners">FENTY BEAUTY · LANCÔME · COTY · L’ORÉAL</div>
</section>

<script>
  (async () => { await document.fonts.ready; await Promise.all([...document.images].map((i) => i.decode().catch(() => 0))); document.body.dataset.ready = "1"; })();
  const only = new URLSearchParams(location.search).get("b");
  if (only) document.querySelectorAll(".board").forEach((b) => b.id === only || b.remove());
</script>
</body>
</html>
